name: promote

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: The release candidate tag to ship, such as v0.10.0-rc.4
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-unknown-linux-gnu
  CANDIDATE: ${{ inputs.candidate }}

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Name the stable version of the release candidate
        run: |
          [[ "$CANDIDATE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]] || { echo "promote: $CANDIDATE is no release candidate tag; pass vX.Y.Z-rc.N" >&2; exit 1; }
          echo "TUMPEL_RELEASE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "TAG=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.candidate }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Stamp the version into the crate
        run: sed -i "0,/^version = \".*\"$/s//version = \"$TUMPEL_RELEASE_VERSION\"/" Cargo.toml

      - name: Build the static x86_64 binary
        env:
          TUMPEL_TARGET: ${{ env.TARGET }}
        run: npm run build:static

      - name: Stage the binary and its sha256
        run: |
          mkdir dist
          cp "target/$TARGET/release/tumpel" dist/tumpel-x86_64-linux
          cd dist
          sha256sum tumpel-x86_64-linux > tumpel-x86_64-linux.sha256
          ./tumpel-x86_64-linux --version

      - name: Tag the release candidate's commit with the stable version
        run: |
          tagged=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$tagged" ]; then
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          elif [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "promote: $TAG already tags $tagged, not the commit of $CANDIDATE; promote a release candidate of that commit" >&2
            exit 1
          fi

      - name: Publish the stable GitHub release with the binary and its sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none) gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag --latest ;;
            true) gh release upload "$TAG" dist/* --clobber && gh release edit "$TAG" --draft=false --latest ;;
            *) echo "promote: $TAG is already published; its binary stays as it is" ;;
          esac
