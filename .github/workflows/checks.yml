name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect a docs-only pull request
        id: changes
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            grep -qvE '^(docs?/.*|.*\.md|LICENSE|\.github/ISSUE_TEMPLATE/.*)$' <<<"$changed" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - if: steps.changes.outputs.code == 'false'
        name: Run the comments and secrets checks
        run: npm run comments:check && npm run secrets:check

      - if: steps.changes.outputs.code == 'true'
        name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2

      - if: steps.changes.outputs.code == 'true'
        run: npm run check

      - if: steps.changes.outputs.code == 'true'
        run: npm test
